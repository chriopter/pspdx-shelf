# A tag v* runs the tests, builds the image for amd64 and arm64, pushes it to
# ghcr.io/chriopter/pspdx-shelf as <version> and latest, and makes the release.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest && python -m pytest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/chriopter/pspdx-shelf:${{ github.ref_name }}
            ghcr.io/chriopter/pspdx-shelf:latest
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "docker pull ghcr.io/chriopter/pspdx-shelf:$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
